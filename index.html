<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說你好 - 互動語音網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 漸層背景動畫 */
        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 脈動與發光效果 */
        .glow-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(233, 30, 99, 0.5);
        }

        .glow-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 20px 35px -5px rgba(233, 30, 99, 0.7);
        }

        .glow-button:active {
            transform: translateY(2px) scale(0.98);
        }

        /* 飄浮粒子動畫 */
        @keyframes float-up {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .floating-particle {
            position: absolute;
            pointer-events: none;
            animation: float-up 1.2s ease-out forwards;
        }

        /* 聲波波紋動畫 */
        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            animation: ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
    </div>

    <main class="relative z-10 bg-white/20 backdrop-blur-xl border border-white/30 rounded-3xl p-8 sm:p-12 max-w-md w-full shadow-2xl text-center flex flex-col items-center">
        
        <!-- 圖示頭像區 -->
        <div class="relative mb-6">
            <div id="avatar-bg" class="w-28 h-28 sm:w-32 sm:h-32 bg-white/30 rounded-full flex items-center justify-center shadow-inner transition-all duration-300">
                <i id="avatar-icon" class="fas fa-smile text-6xl sm:text-7xl text-white transition-all duration-300 transform"></i>
            </div>
            <!-- 播音時出現的聲波環 -->
            <div id="ripple-container" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
                <div class="w-full h-full border-2 border-white/60 rounded-full animate-ping"></div>
            </div>
        </div>

        <!-- 標題與簡介 -->
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide mb-2 drop-shadow-md">
            打個招呼吧！
        </h1>
        <p class="text-white/80 text-sm sm:text-base mb-8 font-medium">
            點擊下方按鈕，聆聽親切的問候聲音
        </p>

        <!-- 展示文字框 -->
        <div class="h-20 flex items-center justify-center mb-8 w-full">
            <div id="greeting-text" class="text-4xl sm:text-5xl font-black text-white tracking-wider opacity-0 transition-all duration-500 transform scale-75 drop-shadow-lg">
                你好！ 👋
            </div>
        </div>

        <!-- 主按鈕 -->
        <button id="say-hello-btn" class="glow-button relative group w-full py-4 px-8 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold text-xl rounded-2xl shadow-lg flex items-center justify-center gap-3 overflow-hidden cursor-pointer select-none">
            <i class="fas fa-volume-high text-2xl group-hover:scale-110 transition-transform"></i>
            <span>按我說你好</span>
        </button>

        <!-- 語音設定與微調選項 -->
        <div class="mt-8 pt-6 border-t border-white/20 w-full flex flex-col gap-3 text-white/90 text-xs sm:text-sm">
            <div class="flex items-center justify-between">
                <label for="voice-select" class="font-semibold flex items-center gap-1.5">
                    <i class="fas fa-language"></i> 選擇語音聲音
                </label>
                <select id="voice-select" class="bg-white/20 border border-white/30 text-white text-xs rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-white/50 max-w-[160px] truncate">
                    <option value="" class="text-gray-800">載入語音中...</option>
                </select>
            </div>
            
            <div class="flex items-center justify-between">
                <label for="pitch-range" class="font-semibold flex items-center gap-1.5">
                    <i class="fas fa-sliders"></i> 音調高低
                </label>
                <input type="range" id="pitch-range" min="0.5" max="1.5" step="0.1" value="1" class="w-24 accent-pink-400 cursor-pointer">
            </div>
        </div>
    </main>

    <script>
        // 取得 DOM 元素
        const sayHelloBtn = document.getElementById('say-hello-btn');
        const greetingText = document.getElementById('greeting-text');
        const avatarIcon = document.getElementById('avatar-icon');
        const avatarBg = document.getElementById('avatar-bg');
        const rippleContainer = document.getElementById('ripple-container');
        const voiceSelect = document.getElementById('voice-select');
        const pitchRange = document.getElementById('pitch-range');

        // Web Speech API 初始化
        const synth = window.speechSynthesis;
        let voices = [];

        // 載入系統可用語音清單
        function loadVoices() {
            voices = synth.getVoices().filter(voice => voice.lang.includes('zh') || voice.lang.includes('ZH'));
            
            // 如果沒有找到中文語音，顯示所有語音作為備用
            if (voices.length === 0) {
                voices = synth.getVoices();
            }

            voiceSelect.innerHTML = '';
            
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                option.classList.add('text-gray-800');
                
                // 優先選擇台灣中文 (zh-TW)
                if (voice.lang === 'zh-TW') {
                    option.selected = true;
                }
                
                voiceSelect.appendChild(option);
            });

            if (voices.length === 0) {
                const option = document.createElement('option');
                option.textContent = '預設系統語音';
                option.classList.add('text-gray-800');
                voiceSelect.appendChild(option);
            }
        }

        // 監聽語音載入事件 (Safari/Chrome 相容處理)
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // 播放「你好」語音
        function speakHello() {
            // 如果正在播放，先取消
            if (synth.speaking) {
                synth.cancel();
            }

            const text = "你好！";
            const utterance = new SpeechSynthesisUtterance(text);
            
            // 設定選擇的語音與音調
            if (voices.length > 0 && voiceSelect.value !== "") {
                utterance.voice = voices[voiceSelect.value];
            }
            utterance.pitch = parseFloat(pitchRange.value);
            utterance.rate = 1; // 語速

            // 開始發音時的視覺效果
            utterance.onstart = () => {
                triggerVisualEffects();
            };

            // 結束發音時重置效果
            utterance.onend = () => {
                stopVisualEffects();
            };

            utterance.onerror = (e) => {
                console.error("語音播放發生錯誤：", e);
                stopVisualEffects();
            };

            synth.speak(utterance);
        }

        // 觸發豐富的視覺與動畫效果
        function triggerVisualEffects() {
            // 1. 文字動畫效果
            greetingText.classList.remove('opacity-0', 'scale-75');
            greetingText.classList.add('opacity-100', 'scale-110', 'animate-bounce');

            // 2. 頭像變幻與旋轉
            avatarIcon.className = "fas fa-laugh-beam text-6xl sm:text-7xl text-yellow-300 transition-all duration-300 transform scale-125 rotate-12";
            avatarBg.classList.add('bg-white/50', 'ring-8', 'ring-white/30');

            // 3. 聲波圈圈
            rippleContainer.classList.remove('opacity-0');

            // 4. 產生動態飄浮表情符號粒子
            createParticles();

            // 復原文字縮放（保留呈現）
            setTimeout(() => {
                greetingText.classList.remove('animate-bounce');
                greetingText.classList.add('scale-100');
            }, 600);
        }

        // 停止/復原視覺效果
        function stopVisualEffects() {
            setTimeout(() => {
                avatarIcon.className = "fas fa-smile text-6xl sm:text-7xl text-white transition-all duration-300 transform";
                avatarBg.classList.remove('bg-white/50', 'ring-8', 'ring-white/30');
                rippleContainer.classList.add('opacity-0');
            }, 500);
        }

        // 產生愛心與星星飄浮粒子動畫
        function createParticles() {
            const symbols = ['✨', '👋', '💖', '⭐', '🎉', '🌸'];
            const container = document.body;

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'floating-particle text-2xl select-none z-20';
                particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];

                // 按鈕四周隨機位置
                const rect = sayHelloBtn.getBoundingClientRect();
                const randomX = rect.left + rect.width / 2 + (Math.random() - 0.5) * 160;
                const randomY = rect.top + (Math.random() - 0.5) * 30;

                particle.style.left = `${randomX}px`;
                particle.style.top = `${randomY}px`;

                container.appendChild(particle);

                // 動態結束後自動清理 DOM
                setTimeout(() => {
                    particle.remove();
                }, 1200);
            }
        }

        // 按鈕綁定點擊事件
        sayHelloBtn.addEventListener('click', () => {
            speakHello();
        });
    </script>
</body>
</html>
